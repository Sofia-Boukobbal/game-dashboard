<div class="classement">
  <h2>🏆 Classement des joueurs</h2>

  <div class="joueur-ligne" 
       *ngFor="let joueur of joueurs; let i = index"
       [ngClass]="i === 0 ? 'premier' : i === 1 ? 'deuxieme' : i === 2 ? 'troisieme' : ''">
    
    <span class="position">
      {{ i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '#' + (i + 1) }}
    </span>
    <!--Ajout des stats sur le classement a cote du joueur.-->
    <span class="joueur-nom">{{ joueur.nom }}</span>
    <span class="joueur-classe">{{ joueur.classe }}</span>
    <span class="joueur-score">{{ joueur.score }} pts</span>
    <span class="joueur-kills">⚔️ {{ joueur.kills }}</span>
  </div>
</div>
